<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa — Círculo de Oração</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --verde: #1D9E75; --verde-claro: #E1F5EE; --verde-escuro: #085041;
    --vermelho: #D85A30; --vermelho-claro: #FAECE7;
    --dourado: #BA7517; --dourado-claro: #FAEEDA;
    --azul: #2563EB; --azul-claro: #EFF6FF;
    --cinza-bg: #F7F5F0; --cinza-card: #FFFFFF; --cinza-borda: #E2DDD5; --cinza-texto: #5F5E5A;
    --texto: #2C2C2A; --radius: 12px; --radius-sm: 8px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--cinza-bg); color: var(--texto); min-height: 100vh; padding-bottom: 5rem; }

  .page-header { background: var(--verde-escuro); color: #fff; padding: 2rem 1.5rem 3rem; text-align: center; position: relative; overflow: hidden; }
  .page-header::before { content:''; position:absolute; width:300px; height:300px; border-radius:50%; background:rgba(255,255,255,0.04); top:-80px; right:-60px; }
  .page-header::after { content:''; position:absolute; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,0.04); bottom:-60px; left:-40px; }
  .page-header h1 { font-family:'Lora',serif; font-size:1.6rem; font-weight:600; }
  .page-header p { font-size:0.85rem; opacity:0.7; margin-top:4px; font-weight:300; }

  .container { max-width:700px; margin:-1.5rem auto 0; padding:0 1rem; position:relative; z-index:1; }

  .resumo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:1rem; }
  .resumo-card { background:var(--cinza-card); border-radius:var(--radius); padding:1rem; border:1px solid var(--cinza-borda); box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; }
  .resumo-card .label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--cinza-texto); margin-bottom:6px; font-weight:500; }
  .resumo-card .valor { font-family:'Lora',serif; font-size:1.1rem; font-weight:600; }
  .resumo-card .sub { font-size:0.68rem; color:var(--cinza-texto); margin-top:3px; }

  .caixas-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1rem; }
  .caixa-card { background:var(--cinza-card); border-radius:var(--radius); padding:1.1rem 1.25rem; border:1px solid var(--cinza-borda); box-shadow:0 2px 8px rgba(0,0,0,0.06); }
  .caixa-card .cc-label { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--cinza-texto); margin-bottom:6px; font-weight:500; display:flex; align-items:center; gap:6px; }
  .caixa-card .cc-valor { font-family:'Lora',serif; font-size:1.4rem; font-weight:600; color:var(--verde); }
  .caixa-card .cc-sub { font-size:0.72rem; color:var(--cinza-texto); margin-top:4px; }

  .saldo-destaque { background:var(--verde-escuro); color:#fff; border-radius:var(--radius); padding:1.25rem 1.5rem; display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; box-shadow:0 4px 16px rgba(8,80,65,0.25); }
  .saldo-destaque .sd-label { font-size:0.78rem; opacity:0.75; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:4px; }
  .saldo-destaque .sd-val { font-family:'Lora',serif; font-size:1.8rem; font-weight:600; }
  .saldo-destaque .sd-icon { font-size:2.2rem; opacity:0.4; }

  .tabs { display:flex; gap:4px; background:var(--cinza-card); border-radius:var(--radius); border:1px solid var(--cinza-borda); padding:4px; margin-bottom:1rem; }
  .tab { flex:1; padding:8px 4px; border:none; background:transparent; border-radius:var(--radius-sm); font-size:0.75rem; font-weight:500; cursor:pointer; color:var(--cinza-texto); transition:all 0.15s; font-family:'DM Sans',sans-serif; }
  .tab.active { background:var(--verde-escuro); color:#fff; }

  .secao { background:var(--cinza-card); border-radius:var(--radius); border:1px solid var(--cinza-borda); margin-bottom:1rem; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
  .secao-header { padding:1rem 1.25rem 0.75rem; border-bottom:1px solid var(--cinza-borda); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .secao-titulo { font-family:'Lora',serif; font-size:1rem; font-weight:600; display:flex; align-items:center; gap:8px; }
  .secao-body { padding:1rem 1.25rem; }

  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:0.72rem; font-weight:500; }
  .badge-verde { background:var(--verde-claro); color:#085041; }
  .badge-vermelho { background:var(--vermelho-claro); color:#71280F; }
  .badge-dourado { background:var(--dourado-claro); color:#633806; }
  .badge-azul { background:var(--azul-claro); color:#1e40af; }

  .tabela { width:100%; border-collapse:collapse; font-size:0.82rem; }
  .tabela th { text-align:left; padding:6px 8px; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--cinza-texto); font-weight:500; border-bottom:1px solid var(--cinza-borda); }
  .tabela td { padding:8px 8px; border-bottom:1px solid #F0EDE8; color:var(--texto); vertical-align:middle; }
  .tabela tr:last-child td { border-bottom:none; }
  .tabela tr:hover td { background:#FAFAF8; }
  .td-verde { text-align:right; font-weight:500; color:var(--verde); }
  .td-vermelho { text-align:right; font-weight:500; color:var(--vermelho); }
  .total-row td { font-weight:600; background:var(--cinza-bg); border-top:2px solid var(--cinza-borda); border-bottom:none; font-family:'Lora',serif; }

  .btn-del { background:none; border:none; cursor:pointer; color:#ccc; font-size:1.05rem; padding:10px 12px; margin:-10px -12px; border-radius:4px; transition:color 0.15s; touch-action:manipulation; }
  .btn-del:hover { color:var(--vermelho); }

  /* Diálogo próprio (substitui confirm()/alert() nativos, que falham em navegadores embutidos como o do WhatsApp/Instagram) */
  .dlg-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:2000; padding:1.25rem; }
  .dlg-box { background:#fff; border-radius:var(--radius); padding:1.25rem; max-width:320px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,0.25); }
  .dlg-msg { font-size:0.92rem; color:var(--texto); margin-bottom:1.1rem; line-height:1.4; }
  .dlg-botoes { display:flex; gap:8px; }
  .dlg-botoes button { flex:1; padding:10px; border-radius:var(--radius-sm); border:none; font-size:0.85rem; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif; touch-action:manipulation; }
  .dlg-cancelar { background:var(--cinza-bg); color:var(--texto); border:1px solid var(--cinza-borda) !important; }
  .dlg-confirmar { background:var(--vermelho); color:#fff; }
  .dlg-ok { background:var(--verde-escuro); color:#fff; }

  /* Tipo toggle */
  .tipo-toggle { display:flex; gap:6px; margin-bottom:10px; }
  .tipo-btn { flex:1; padding:9px; border-radius:var(--radius-sm); font-size:0.85rem; font-weight:500; cursor:pointer; border:1.5px solid var(--cinza-borda); background:var(--cinza-bg); color:var(--cinza-texto); transition:all 0.15s; font-family:'DM Sans',sans-serif; }
  .tipo-btn.active-entrada { background:var(--verde-claro); color:#085041; border-color:#5DCAA5; }
  .tipo-btn.active-saida { background:var(--vermelho-claro); color:#71280F; border-color:#F0997B; }

  /* Caixa toggle */
  .caixa-toggle { display:flex; gap:6px; margin-bottom:10px; }
  .caixa-btn { flex:1; padding:9px; border-radius:var(--radius-sm); font-size:0.85rem; font-weight:500; cursor:pointer; border:1.5px solid var(--cinza-borda); background:var(--cinza-bg); color:var(--cinza-texto); transition:all 0.15s; font-family:'DM Sans',sans-serif; }
  .caixa-btn.active { background:var(--azul-claro); color:#1e40af; border-color:#93c5fd; }

  .form-add { background:var(--cinza-bg); border-radius:var(--radius-sm); padding:1rem; margin-top:1rem; border:1px solid var(--cinza-borda); }
  .form-add h4 { font-size:0.8rem; font-weight:500; color:var(--cinza-texto); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
  .form-row.cols3 { grid-template-columns:1fr 1fr 1fr; }
  .form-row.full { grid-template-columns:1fr; }
  .form-group { display:flex; flex-direction:column; gap:3px; }
  .form-group label { font-size:0.72rem; color:var(--cinza-texto); font-weight:500; }
  .form-group input, .form-group select { font-size:0.88rem; padding:8px 10px; border:1px solid var(--cinza-borda); border-radius:var(--radius-sm); background:#fff; color:var(--texto); outline:none; font-family:'DM Sans',sans-serif; }
  .form-group input:focus, .form-group select:focus { border-color:var(--verde); box-shadow:0 0 0 2px rgba(29,158,117,0.1); }
  .btn-add { width:100%; padding:10px; border:none; border-radius:var(--radius-sm); background:var(--verde-escuro); color:#fff; font-size:0.88rem; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif; margin-top:4px; transition:opacity 0.15s; }
  .btn-add:hover { opacity:0.88; }

  .ajuste-form { background:var(--dourado-claro); border-radius:var(--radius-sm); padding:1rem; margin-top:1rem; border:1px solid #e8c97a; }
  .ajuste-form h4 { font-size:0.8rem; font-weight:500; color:#633806; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:10px; }
  .btn-ajuste { width:100%; padding:10px; border:none; border-radius:var(--radius-sm); background:var(--dourado); color:#fff; font-size:0.88rem; font-weight:500; cursor:pointer; font-family:'DM Sans',sans-serif; margin-top:4px; }

  .fiado-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #F0EDE8; font-size:0.88rem; }
  .fiado-item:last-child { border-bottom:none; }
  .fiado-total { display:flex; justify-content:space-between; padding:10px 0 0; border-top:2px solid var(--cinza-borda); margin-top:4px; }
  .fiado-total .fl { color:var(--cinza-texto); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.06em; font-weight:500; }
  .fiado-total .fv { color:var(--dourado); font-weight:700; font-family:'Lora',serif; font-size:1.05rem; }

  .panel { display:none; }
  .panel.active { display:block; }

  .loader { text-align:center; padding:3rem; color:var(--cinza-texto); font-size:0.9rem; }
  .spinner { width:32px; height:32px; border:3px solid var(--cinza-borda); border-top-color:var(--verde); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .rodape { text-align:center; font-size:0.75rem; color:var(--cinza-texto); margin-top:2rem; opacity:0.7; }

  @media(max-width:480px) {
    .resumo-grid { grid-template-columns:1fr 1fr; }
    .resumo-card.total-geral { grid-column:1/-1; }
    .caixas-grid { grid-template-columns:1fr 1fr; }
    .page-header h1 { font-size:1.3rem; }
    .saldo-destaque .sd-val { font-size:1.4rem; }
    .form-row { grid-template-columns:1fr; }
    .form-row.cols3 { grid-template-columns:1fr; }
  }
</style>
</head>

<button onclick="carregar()" title="Atualizar dados" style="position:fixed;bottom:24px;right:20px;z-index:999;width:48px;height:48px;border-radius:50%;background:#085041;color:#fff;border:none;font-size:1.3rem;cursor:pointer;box-shadow:0 4px 16px rgba(8,80,65,0.4);">↻</button>

<div class="container" id="app">
  <div class="loader" id="loader">
    <div class="spinner"></div>
    Carregando dados...
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxwKN7hKREdXnEpEH0RL7AztOatgXTbYFeG73C1EqU2JvhS_PIIJvPSIjmhYsGfAG-0/exec';
let dados = { lancamentos:[], ajustes:{dinheiro:0,conta:0}, fiados:[] };
let tipoAtual = 'entrada';
let caixaAtual = 'dinheiro';
let painelAtivo = 'lancamentos';
let primeiraCarga = true;

// IDs dos campos de formulário que precisam ser preservados entre atualizações
const CAMPOS_FORM = ['n-data','n-valor','n-categoria','n-desc','f-nome','f-valor','aj-dinheiro','aj-conta'];

function fmt(v) {
  return 'R$ ' + Number(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

// Trava simples: impede que dois cliques rápidos disparem a mesma operação duas vezes
let ocupado = false;

function gerarId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
}

// Substitui window.confirm/window.alert: em navegadores embutidos de app
// (WhatsApp, Instagram, Facebook etc.) os diálogos nativos costumam ser
// bloqueados ou retornar sem mostrar nada — por isso a exclusão "não fazia
// nada" só no celular. Este diálogo é HTML puro, então funciona sempre.
function confirmar(mensagem) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'dlg-overlay';
    overlay.innerHTML = `
      <div class="dlg-box">
        <div class="dlg-msg">${mensagem}</div>
        <div class="dlg-botoes">
          <button class="dlg-cancelar">Cancelar</button>
          <button class="dlg-confirmar">Remover</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const fechar = (resultado) => { overlay.remove(); resolve(resultado); };
    overlay.querySelector('.dlg-cancelar').onclick = () => fechar(false);
    overlay.querySelector('.dlg-confirmar').onclick = () => fechar(true);
    overlay.onclick = (e) => { if (e.target === overlay) fechar(false); };
  });
}

function avisar(mensagem) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'dlg-overlay';
    overlay.innerHTML = `
      <div class="dlg-box">
        <div class="dlg-msg">${mensagem}</div>
        <div class="dlg-botoes"><button class="dlg-ok">OK</button></div>
      </div>`;
    document.body.appendChild(overlay);
    const fechar = () => { overlay.remove(); resolve(); };
    overlay.querySelector('.dlg-ok').onclick = fechar;
    overlay.onclick = (e) => { if (e.target === overlay) fechar(); };
  });
}

async function api(params) {
  const qs = Object.entries(params).map(([k,v]) => encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&');
  const r = await fetch(SCRIPT_URL + '?' + qs);
  if (!r.ok) throw new Error('Servidor respondeu ' + r.status);
  const json = await r.json();
  if (json && json.error) throw new Error(json.error);
  return json;
}

// Verifica se o usuário está com o foco em algum campo de formulário (digitando)
function usuarioDigitando() {
  const el = document.activeElement;
  if (!el) return false;
  return CAMPOS_FORM.includes(el.id);
}

async function carregar() {
  // Evita interromper o usuário: se ele estiver digitando em algum campo,
  // pula esta atualização automática (a próxima tentativa vem no próximo ciclo).
  if (!primeiraCarga && usuarioDigitando()) return;

  const loader = document.getElementById('loader');
  if (loader && primeiraCarga) loader.style.display = 'block';
  try {
    dados = await api({ action:'getDados' });
    render();
    primeiraCarga = false;
  } catch(e) {
    console.error(e);
    if (primeiraCarga) {
      document.getElementById('app').innerHTML =
        '<div class="loader">Não foi possível carregar os dados.<br><small>' + e.message + '</small></div>';
    }
  }
}

function calcular() {
  const lanc = dados.lancamentos || [];
  const aj   = dados.ajustes || {dinheiro:0, conta:0};

  const dinEntradas = lanc.filter(l=>l.tipo==='entrada'&&l.caixa==='dinheiro').reduce((a,l)=>a+l.valor,0);
  const dinSaidas   = lanc.filter(l=>l.tipo==='saida'  &&l.caixa==='dinheiro').reduce((a,l)=>a+l.valor,0);
  const ctaEntradas = lanc.filter(l=>l.tipo==='entrada'&&l.caixa==='conta').reduce((a,l)=>a+l.valor,0);
  const ctaSaidas   = lanc.filter(l=>l.tipo==='saida'  &&l.caixa==='conta').reduce((a,l)=>a+l.valor,0);

  const saldoDinheiro = (aj.dinheiro||0) + dinEntradas - dinSaidas;
  const saldoConta    = (aj.conta||0)    + ctaEntradas - ctaSaidas;
  const totalEntradas = dinEntradas + ctaEntradas;
  const totalSaidas   = dinSaidas   + ctaSaidas;
  const totalGeral    = saldoDinheiro + saldoConta;

  return { saldoDinheiro, saldoConta, totalEntradas, totalSaidas, totalGeral };
}

// Marca lançamentos idênticos (mesma data, tipo, caixa, valor e descrição)
function marcarDuplicados(lanc) {
  const contagem = {};
  lanc.forEach(l => {
    const chave = [l.data, l.tipo, l.caixa, l.valor, l.descricao || l.categoria].join('|');
    contagem[chave] = (contagem[chave] || 0) + 1;
    l._chave = chave;
  });
  lanc.forEach(l => { l._dup = contagem[l._chave] > 1; });
  return lanc;
}

function render() {
  const c = calcular();
  const lanc = marcarDuplicados(dados.lancamentos || []);
  const fiados = dados.fiados || [];
  const totalFiados = fiados.reduce((a,f)=>a+f.valor,0);

  // Salva o que o usuário já tinha preenchido nos formulários antes de recriar o HTML
  const valoresSalvos = {};
  CAMPOS_FORM.forEach(id => {
    const el = document.getElementById(id);
    if (el) valoresSalvos[id] = el.value;
  });

  document.getElementById('app').innerHTML = `
    <div class="resumo-grid">
      <div class="resumo-card">
        <div class="label">Entradas</div>
        <div class="valor" style="color:var(--verde)">${fmt(c.totalEntradas)}</div>
      </div>
      <div class="resumo-card">
        <div class="label">Saídas</div>
        <div class="valor" style="color:var(--vermelho)">${fmt(c.totalSaidas)}</div>
      </div>
      <div class="resumo-card total-geral">
        <div class="label">Fiados a receber</div>
        <div class="valor" style="color:var(--dourado)">${fmt(totalFiados)}</div>
      </div>
    </div>

    <div class="caixas-grid">
      <div class="caixa-card">
        <div class="cc-label">💵 Dinheiro</div>
        <div class="cc-valor">${fmt(c.saldoDinheiro)}</div>
        <div class="cc-sub">Caixa físico</div>
      </div>
      <div class="caixa-card">
        <div class="cc-label">🏦 Conta</div>
        <div class="cc-valor" style="color:var(--azul)">${fmt(c.saldoConta)}</div>
        <div class="cc-sub">Saldo bancário</div>
      </div>
    </div>

    <div class="saldo-destaque">
      <div>
        <div class="sd-label">Total Geral</div>
        <div class="sd-val">${fmt(c.totalGeral)}</div>
      </div>
      <div class="sd-icon">💰</div>
    </div>

    <div class="tabs">
      <button class="tab ${painelAtivo==='lancamentos'?'active':''}" onclick="showPanel('lancamentos',this)">📋 Lançamentos</button>
      <button class="tab ${painelAtivo==='novo'?'active':''}" onclick="showPanel('novo',this)">➕ Novo</button>
      <button class="tab ${painelAtivo==='fiados'?'active':''}" onclick="showPanel('fiados',this)">📌 Fiados</button>
      <button class="tab ${painelAtivo==='ajuste'?'active':''}" onclick="showPanel('ajuste',this)">⚙️ Ajuste</button>
    </div>

    <!-- LANÇAMENTOS -->
    <div id="panel-lancamentos" class="panel ${painelAtivo==='lancamentos'?'active':''}">
      <div class="secao">
        <div class="secao-header">
          <div class="secao-titulo">📋 Histórico de Lançamentos</div>
        </div>
        <div class="secao-body">
          <table class="tabela">
            <thead><tr><th>Data</th><th>Descrição</th><th>Caixa</th><th style="text-align:right">Valor</th><th></th></tr></thead>
            <tbody>
              ${lanc.map(l=>`
                <tr${l._dup ? ' style="background:#FFF9E8"' : ''}>
                  <td>${l.data}</td>
                  <td>
                    ${l.descricao || l.categoria}
                    <span class="badge ${l.tipo==='entrada'?'badge-verde':'badge-vermelho'}" style="margin-left:4px">${l.tipo==='entrada'?'E':'S'}</span>
                    ${l._dup ? '<span class="badge badge-dourado" style="margin-left:4px" title="Existe outro lançamento idêntico">⚠ duplicado</span>' : ''}
                  </td>
                  <td><span class="badge ${l.caixa==='dinheiro'?'badge-dourado':'badge-azul'}">${l.caixa==='dinheiro'?'💵':'🏦'}</span></td>
                  <td class="${l.tipo==='entrada'?'td-verde':'td-vermelho'}">${l.tipo==='entrada'?'+':'-'}${fmt(l.valor)}</td>
                  <td><button class="btn-del" onclick="deletarLanc('${l.id}')">✕</button></td>
                </tr>`).join('')}
            </tbody>
          </table>
          ${lanc.length===0?'<div style="text-align:center;padding:2rem;color:var(--cinza-texto);font-size:0.88rem">Nenhum lançamento ainda.</div>':''}
        </div>
      </div>
    </div>

    <!-- NOVO LANÇAMENTO -->
    <div id="panel-novo" class="panel ${painelAtivo==='novo'?'active':''}">
      <div class="secao">
        <div class="secao-header">
          <div class="secao-titulo">➕ Novo Lançamento</div>
        </div>
        <div class="secao-body">
          <div class="tipo-toggle">
            <button class="tipo-btn ${tipoAtual==='entrada'?'active-entrada':''}" id="btn-entrada" onclick="setTipo('entrada')">📥 Entrada</button>
            <button class="tipo-btn ${tipoAtual==='saida'?'active-saida':''}" id="btn-saida" onclick="setTipo('saida')">📤 Saída</button>
          </div>
          <div class="caixa-toggle">
            <button class="caixa-btn ${caixaAtual==='dinheiro'?'active':''}" id="btn-dinheiro" onclick="setCaixa('dinheiro')">💵 Dinheiro</button>
            <button class="caixa-btn ${caixaAtual==='conta'?'active':''}" id="btn-conta" onclick="setCaixa('conta')">🏦 Conta</button>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Data</label>
              <input type="date" id="n-data">
            </div>
            <div class="form-group">
              <label>Valor (R$)</label>
              <input type="number" id="n-valor" step="0.01" placeholder="0,00">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Categoria</label>
              <select id="n-categoria">
                <option value="Coleta">Coleta / Dízimo</option>
                <option value="Doação">Doação</option>
                <option value="Pregadora">Pregadora</option>
                <option value="Material">Material</option>
                <option value="Lanche">Lanche</option>
                <option value="Missão">Missão</option>
                <option value="Outro">Outro</option>
              </select>
            </div>
            <div class="form-group">
              <label>Descrição</label>
              <input type="text" id="n-desc" placeholder="Detalhe o lançamento">
            </div>
          </div>
          <button class="btn-add" onclick="addLancamento()">Registrar lançamento</button>
        </div>
      </div>
    </div>

    <!-- FIADOS -->
    <div id="panel-fiados" class="panel ${painelAtivo==='fiados'?'active':''}">
      <div class="secao">
        <div class="secao-header">
          <div class="secao-titulo">📌 Fiados — Pão</div>
          <span class="badge badge-dourado">${fmt(totalFiados)} a receber</span>
        </div>
        <div class="secao-body">
          ${fiados.map(f=>`
            <div class="fiado-item">
              <span>${f.nome}</span>
              <div style="display:flex;align-items:center;gap:10px">
                <span style="color:var(--dourado);font-weight:600;font-family:'Lora',serif">${fmt(f.valor)}</span>
                <button class="btn-del" onclick="deletarFiado('${f.id}')">✕</button>
              </div>
            </div>`).join('')}
          <div class="fiado-total">
            <span class="fl">Total a receber</span>
            <span class="fv">${fmt(totalFiados)}</span>
          </div>
          <div class="form-add">
            <h4>+ Adicionar fiado</h4>
            <div class="form-row">
              <div class="form-group"><label>Nome</label><input type="text" id="f-nome" placeholder="Nome da pessoa"></div>
              <div class="form-group"><label>Valor (R$)</label><input type="number" id="f-valor" step="0.01" placeholder="0,00"></div>
            </div>
            <button class="btn-add" onclick="addFiado()">Registrar fiado</button>
          </div>
        </div>
      </div>
    </div>

    <!-- AJUSTE MANUAL -->
    <div id="panel-ajuste" class="panel ${painelAtivo==='ajuste'?'active':''}">
      <div class="secao">
        <div class="secao-header">
          <div class="secao-titulo">⚙️ Ajuste de Saldo</div>
        </div>
        <div class="secao-body">
          <p style="font-size:0.85rem;color:var(--cinza-texto);margin-bottom:1rem">Use para corrigir o saldo inicial ou ajustar diferenças. Este valor é somado aos lançamentos.</p>
          <div class="ajuste-form">
            <h4>✏️ Ajuste manual</h4>
            <div class="form-row">
              <div class="form-group">
                <label>Ajuste Dinheiro (R$)</label>
                <input type="number" id="aj-dinheiro" step="0.01" value="${(dados.ajustes||{dinheiro:0}).dinheiro}">
              </div>
              <div class="form-group">
                <label>Ajuste Conta (R$)</label>
                <input type="number" id="aj-conta" step="0.01" value="${(dados.ajustes||{conta:0}).conta}">
              </div>
            </div>
            <button class="btn-ajuste" onclick="salvarAjuste()">💾 Salvar ajuste</button>
          </div>
        </div>
      </div>
    </div>

    <div class="rodape">Círculo de Oração · Sincronizado com Google Planilhas</div>
  `;

  // Restaura os valores que o usuário já tinha digitado
  CAMPOS_FORM.forEach(id => {
    const el = document.getElementById(id);
    if (el && valoresSalvos[id]) el.value = valoresSalvos[id];
  });

  // Data padrão hoje, só se o campo ainda estiver vazio
  const ndData = document.getElementById('n-data');
  if (ndData && !ndData.value) {
    ndData.value = new Date().toISOString().split('T')[0];
  }
}

function showPanel(id, btn) {
  painelAtivo = id;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  btn.classList.add('active');
}

function setTipo(t) {
  tipoAtual = t;
  document.getElementById('btn-entrada').className = 'tipo-btn' + (t==='entrada' ? ' active-entrada' : '');
  document.getElementById('btn-saida').className   = 'tipo-btn' + (t==='saida'   ? ' active-saida'   : '');
}

function setCaixa(c) {
  caixaAtual = c;
  document.getElementById('btn-dinheiro').className = 'caixa-btn' + (c==='dinheiro' ? ' active' : '');
  document.getElementById('btn-conta').className    = 'caixa-btn' + (c==='conta'    ? ' active' : '');
}

async function addLancamento() {
  if (ocupado) return;
  const data      = document.getElementById('n-data').value;
  const valor     = document.getElementById('n-valor').value;
  const categoria = document.getElementById('n-categoria').value;
  const descricao = document.getElementById('n-desc').value.trim();
  if (!data || !valor) { await avisar('Preencha data e valor.'); return; }

  ocupado = true;
  try {
    // O id é gerado aqui. Se a requisição for reenviada, o backend reconhece
    // o mesmo id e não grava duas vezes.
    await api({ action:'addLancamento', id:gerarId(), data, tipo:tipoAtual, caixa:caixaAtual, categoria, descricao, valor });
    document.getElementById('n-valor').value = '';
    document.getElementById('n-desc').value = '';
    await carregar();
  } catch (e) {
    await avisar('Não foi possível registrar: ' + e.message);
  } finally {
    ocupado = false;
  }
}

async function deletarLanc(id) {
  if (ocupado) return;
  if (!id || id === 'undefined') {
    await avisar('Este lançamento está sem id. Atualize a página (↻) e tente de novo.');
    return;
  }
  if (!(await confirmar('Remover este lançamento?'))) return;

  ocupado = true;
  try {
    await api({ action:'deleteLancamento', id });
    await carregar();
  } catch (e) {
    await avisar('Não foi possível excluir: ' + e.message);
    await carregar();
  } finally {
    ocupado = false;
  }
}

async function addFiado() {
  if (ocupado) return;
  const nome  = document.getElementById('f-nome').value.trim();
  const valor = document.getElementById('f-valor').value;
  if (!nome || !valor) { await avisar('Preencha nome e valor.'); return; }

  ocupado = true;
  try {
    await api({ action:'addFiado', id:gerarId(), nome, valor });
    document.getElementById('f-nome').value = '';
    document.getElementById('f-valor').value = '';
    await carregar();
  } catch (e) {
    await avisar('Não foi possível registrar: ' + e.message);
  } finally {
    ocupado = false;
  }
}

async function deletarFiado(id) {
  if (ocupado) return;
  if (!id || id === 'undefined') {
    await avisar('Este fiado está sem id. Atualize a página (↻) e tente de novo.');
    return;
  }
  if (!(await confirmar('Remover este fiado?'))) return;

  ocupado = true;
  try {
    await api({ action:'deleteFiado', id });
    await carregar();
  } catch (e) {
    await avisar('Não foi possível excluir: ' + e.message);
    await carregar();
  } finally {
    ocupado = false;
  }
}

async function salvarAjuste() {
  if (ocupado) return;
  const dinheiro = document.getElementById('aj-dinheiro').value;
  const conta    = document.getElementById('aj-conta').value;

  ocupado = true;
  try {
    await api({ action:'ajusteManual', dinheiro, conta });
    await carregar();
    await avisar('Ajuste salvo!');
  } catch (e) {
    await avisar('Não foi possível salvar o ajuste: ' + e.message);
  } finally {
    ocupado = false;
  }
}

// Inicia
carregar();
setInterval(carregar, 30000);
</script>
</body>
</html>
